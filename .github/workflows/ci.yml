name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, xmlwriter, mbstring, iconv, dom, zip
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --no-plugins --no-scripts --prefer-dist
      - run: composer audit
      - run: composer check
      - run: php -n tools/core-smoke.php
      - run: php tools/verify-install.php
      - run: php tools/verify-install.php --with-renderer

  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, xmlwriter, mbstring, iconv, dom
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --no-plugins --no-scripts
      - run: composer audit
      - run: composer check

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, xmlwriter, iconv, mbstring, dom
          tools: composer:v2
          coverage: none
      - run: composer update --no-interaction --no-plugins --no-scripts --prefer-dist
      - run: php tools/render-fixtures.php
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install zxing-cpp==3.1.1 Pillow==12.3.0 PyMuPDF==1.28.0
      - run: python tools/decode-fixtures.py
